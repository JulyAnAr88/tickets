{% extends "base_auth.html" %}

{% block content %}
<div class="card shadow" style="border-radius: 1rem; overflow: hidden;">
    <!-- Header con estilo CEDIR -->
    <div class="card-header text-white text-center py-4" style="background-color: var(--azul-cedir, #002856);">
        <div class="mb-2">
            <img src="{{ url_for('cedir_common.static', filename='img/logo.png') }}" 
                 alt="CEDIR" 
                 style="height: 50px; filter: brightness(0) invert(1);">
        </div>
        <h4 class="mb-0" style="font-family: 'Montserrat', sans-serif;">
            <i class="bi bi-shield-lock"></i> Sistema de Gestión
        </h4>
        <p class="mb-0 mt-2 small" style="opacity: 0.9;">
            Centro de Investigación, Diagnóstico y Rehabilitación
        </p>
    </div>
    
    <div class="card-body p-4">
        <h5 class="text-center mb-4" style="color: var(--color-text, #1E293B);">
            <i class="bi bi-person-badge"></i> Iniciar Sesión
        </h5>
        
        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">
                    <i class="bi bi-envelope"></i> Correo Electrónico
                </label>
                <input type="email" class="form-control" id="email" name="email" 
                       placeholder="tu@email.com" required
                       style="border-radius: 0.5rem; padding: 0.75rem;">
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">
                    <i class="bi bi-key"></i> Contraseña
                </label>
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="••••••••" required
                       style="border-radius: 0.5rem; padding: 0.75rem;">
            </div>
            
            <div class="text-end mb-3">
                <a href="{{ url_for('cedir_auth.forgot_password', redirect_to=url_for('login')) }}" class="small text-decoration-none">
                    <i class="bi bi-question-circle"></i> Olvidé mi contraseña
                </a>
            </div>
            
            <button type="submit" class="btn w-100 py-2" 
                    style="background-color: var(--verde-cedir, #1FB58F); border-color: var(--verde-cedir, #1FB58F); color: white; border-radius: 0.5rem; font-weight: 600;">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>
        </form>
    </div>
    
    <!-- Footer del card -->
    <div class="card-footer text-center py-3" style="background-color: var(--gris-fondo, #F9FAFB);">
        <small style="color: var(--color-text-secondary, #64748B);">
            <i class="bi bi-shield-check"></i> Acceso seguro solo para usuarios autorizados
        </small>
    </div>
</div>


{% endblock %}
