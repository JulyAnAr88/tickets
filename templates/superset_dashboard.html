{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <h3>Tablero #{{ dashboard_id }}</h3>
                    <p class="text-muted mb-0">Visualización de datos embebida desde Superset</p>
                </div>                
            </div>
            <div class="card-body">
                <!-- Método 1: Usando el endpoint nativo de embed de Superset -->
               
                
                <div class="embed-container" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
                    <iframe
                        src="{{ dashboard_url }}"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;"
                        title="Superset Dashboard"
                        allow="fullscreen"
                        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation"
                    >
                    </iframe>
                </div>
                
                <!-- Script para forzar la recarga si hay errores -->
                <script>
                // Manejar errores de iframe
                const iframe = document.querySelector('iframe');
                if (iframe) {
                    iframe.onerror = function() {
                        console.error('Error loading iframe');
                        // Recargar después de 2 segundos
                        setTimeout(() => {
                            iframe.src = iframe.src;
                        }, 2000);
                    };
                    
                    // Escuchar mensajes de Superset
                    window.addEventListener('message', function(event) {
                        if (event.origin === '{{ superset_url if superset_url else "http://192.168.37.182:8088" }}') {
                            console.log('Mensaje de Superset:', event.data);
                        }
                    });
                }
                </script>
