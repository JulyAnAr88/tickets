<div class="offcanvas offcanvas-start sidebar-mobile" tabindex="-1" id="sidebarMenuMobile">
    <div class="offcanvas-header">
        <div class="sidebar-header">
            <img src="{{ url_for('cedir_common.static', filename='img/logo.png') }}"
                 alt="CEDIR" class="sidebar-logo sidebar-logo-full">
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
        </div>
    </div>
    <div class="offcanvas-body">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link-item {% if request.endpoint == 'abm' %}active{% endif %}" href="{{ url_for('abm') }}" style="color:var(--sidebar-text);display:flex;align-items:center;gap:12px;padding:10px 16px;text-decoration:none;">
                    <i class="bi bi-images"></i> Gestión de Imágenes
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link-item {% if request.endpoint == 'superset' %}active{% endif %}" href="{{ url_for('superset') }}" style="color:var(--sidebar-text);display:flex;align-items:center;gap:12px;padding:10px 16px;text-decoration:none;">
                    <i class="bi bi-graph-up"></i> Dashboard
                </a>
            </li>
        </ul>
    </div>
    <div class="offcanvas-footer">
        <div class="theme-switch-wrapper">
            <div class="theme-switch-row">
                <i class="bi bi-sun-fill"></i>
                <div class="theme-switch" role="button" tabindex="0">
                    <div class="theme-switch-slider"></div>
                </div>
                <i class="bi bi-moon-fill"></i>
            </div>
        </div>
        {% if user %}
        <div class="sidebar-user" style="padding:10px 16px;color:var(--sidebar-text);display:flex;align-items:center;gap:10px;">
            <i class="bi bi-person-circle"></i>
            <span>{{ user.full_name or user.email.split('@')[0] }}</span>
        </div>
        {% endif %}
    </div>
</div>
