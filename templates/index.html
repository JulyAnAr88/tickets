{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="jumbotron bg-light p-5 rounded">
            <h1 class="display-4">Sistema de Gestión de Tickets</h1>
            <p class="lead">Sistema para carga y gestión de imágenes de tickets</p>
            <hr class="my-4">
            <div class="row mt-5">
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-images"></i> Gestión de Imágenes
                            </h5>
                            <p class="card-text">Cargar nuevas imágenes y ver listado completo</p>
                            <a href="{{ url_for('abm') }}" class="btn btn-primary">Ir a Gestión</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-graph-up"></i> Dashboard
                            </h5>
                            <p class="card-text">Visualizar análisis y reportes con Superset</p>
                            <a href="{{ url_for('superset') }}" class="btn btn-info">Ver Dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
