{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h3>Dashboard de Análisis</h3>
            </div>
            <div class="card-body">
                <div class="embed-responsive" style="height: 800px;">
                    <iframe 
                        src="{{ superset_url }}" 
                        style="width: 100%; height: 100%; border: none;"
                        title="Superset Dashboard">
                    </iframe>
                </div>
                <div class="alert alert-info mt-3">
                    <strong>Nota:</strong> Para integrar Superset, asegúrate de tenerlo corriendo en {{ superset_url }}.
                    Puedes usar la API en <code>/api/pacientes</code> para conectar con Superset.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
