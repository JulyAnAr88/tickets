{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header mi-perfil text-white">
                <h4 class="mb-0">Mi Perfil</h4>
            </div>
            <div class="card-body">
                <div class="text-center mb-4">
                    {% if user.avatar_url %}
                        <img src="{{ user.avatar_url }}" alt="Avatar" class="rounded-circle" style="width: 120px; height: 120px; object-fit: cover;">
                    {% else %}
                        <i class="bi bi-person-circle" style="font-size: 120px;"></i>
                    {% endif %}
                </div>
                
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="avatar" class="form-label">Avatar</label>
                        <input type="file" class="form-control" id="avatar" name="avatar" accept="image/*">
                        <small class="text-muted">Formatos: JPG, PNG, GIF (máx 2MB)</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" value="{{ user.full_name or '' }}" disabled>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" value="{{ user.email }}" disabled>
                        <small class="text-muted">El correo no se puede modificar</small>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header bg-warning text-dark" role="button" data-bs-toggle="collapse" data-bs-target="#cambiarPassword" style="cursor: pointer;">
                <h5 class="mb-0 d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-key"></i> Cambiar Contraseña</span>
                    <i class="bi bi-chevron-down" id="chevronIcon"></i>
                </h5>
            </div>
            <div class="collapse" id="cambiarPassword">
                <div class="card-body">
                    <form method="POST" action="{{ url_for('cambiar_password') }}">
                        <div class="mb-3">
                            <label for="current_password" class="form-label">Contraseña Actual</label>
                            <input type="password" class="form-control" id="current_password" name="current_password" required>
                        </div>
                        <div class="mb-3">
                            <label for="new_password" class="form-label">Nueva Contraseña</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirmar Nueva Contraseña</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-warning w-100">
                            <i class="bi bi-key"></i> Cambiar Contraseña
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('cambiarPassword').addEventListener('show.bs.collapse', function () {
    document.getElementById('chevronIcon').className = 'bi bi-chevron-up';
});
document.getElementById('cambiarPassword').addEventListener('hide.bs.collapse', function () {
    document.getElementById('chevronIcon').className = 'bi bi-chevron-down';
});
</script>
{% endblock %}
